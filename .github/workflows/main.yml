name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Needed only when a v* tag is pushed and the workflow creates/updates its GitHub Release.
permissions:
  contents: write

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android build platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Prepare release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "mode=public-debug" >> "$GITHUB_OUTPUT"
            echo "No signing secrets configured -> will use public debug signature (installable release APK)."
            exit 0
          fi

          : "${ANDROID_KEYSTORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD when providing a keystore}"
          : "${ANDROID_KEY_ALIAS:?Set ANDROID_KEY_ALIAS when providing a keystore}"
          : "${ANDROID_KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD when providing a keystore}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "mode=private" >> "$GITHUB_OUTPUT"
          echo "Using private keystore from secrets."

      - name: Assemble release APK (private signature)
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace \
            "-PRELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" \
            "-PRELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" \
            "-PRELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS" \
            "-PRELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"

      - name: Assemble release APK (public debug signature - installable)
        if: steps.signing.outputs.signed != 'true'
        run: |
          set -euo pipefail
          echo "Building release APK with public debug signature (installable without private keystore)..."
          ./gradlew :app:assembleRelease --stacktrace
          echo "Verifying APK is signed..."
          # build-tools version may vary; find apksigner
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK: $APK"
          # Use apksigner if available to verify
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK" || apksigner verify --verbose "$APK" --min-sdk-version 26 || true
          else
            BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n1)
            if [[ -f "$BUILD_TOOLS_DIR/apksigner" ]]; then
              "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK" || true
            else
              echo "apksigner not found, skipping verification (APK is still signed via debug config)"
            fi
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-number-watcher-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${apks[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${apks[@]}" \
              --title "$TAG_NAME" \
              --generate-notes
          fi
