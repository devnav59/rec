name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Needed only when a v* tag is pushed and the workflow creates/updates its GitHub Release.
permissions:
  contents: write

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android build platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Prepare optional release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets configured; an unsigned release APK will be built."
            exit 0
          fi

          : "${ANDROID_KEYSTORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD when providing a keystore}"
          : "${ANDROID_KEY_ALIAS:?Set ANDROID_KEY_ALIAS when providing a keystore}"
          : "${ANDROID_KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD when providing a keystore}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNED_BUILD: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          if [[ "$SIGNED_BUILD" == "true" ]]; then
            ./gradlew :app:assembleRelease --stacktrace \
              "-PRELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" \
              "-PRELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" \
              "-PRELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS" \
              "-PRELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          else
            ./gradlew :app:assembleRelease --stacktrace
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-number-watcher-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${apks[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${apks[@]}" \
              --title "$TAG_NAME" \
              --generate-notes
          fi
